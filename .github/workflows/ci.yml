name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://hrms:hrms@localhost:5432/hrms"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      ENCRYPTION_KEY: "ci-placeholder-32-byte-base64-key-AAAAAAAAAA="
      CRON_SECRET: "ci-placeholder-secret"
      UPLOADS_DIR: "./uploads"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
